server.port=8434
# Database connection properties
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://ep-square-art-anajsdfa-pooler.c-6.us-east-1.aws.neon.tech:5432/neondb
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
# JPA properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

upload.dir = mp3songs
upload.dir2 = uploads


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.operations-sorter=method

spring.config.import=optional:file:./.env[.properties]

# Відновлення паролю: час життя посилання (30 хвилин)
jwt.password-reset-expiration-ms=1800000

# Базова адреса сторінки встановлення нового паролю у фронтенді
app.password-reset.link-base-url=${FRONTEND_URL:http://localhost:5173/forgot-password}

# Dev-помічник: повертати OTP-коди у відповіді API (не вмикати в production)
app.dev.expose-code=false

# Dev-помічник: повертати посилання для відновлення паролю у відповіді API
app.dev.expose-reset-link=false


app.mail.enabled=true
app.mail.from=${MAIL_USER}

spring.mail.host=smtp.ukr.net
spring.mail.port=465
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.ukr.net
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000